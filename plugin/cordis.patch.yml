# dsh-plugin-net-access: permission preset layer.
# Replaces the dsh-base `permission` row config entirely (patches replace the
# row's whole config, so every preset is restated here).
# NOTE: this preset only takes effect together with the engine patch pack
# (install.ps1) — rc.6's closed mode vocabulary cannot be extended by config
# alone. See README.md.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      net-access:
        sandbox: net-access
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
