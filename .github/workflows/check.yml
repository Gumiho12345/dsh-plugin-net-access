name: check

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify recipes, patch LF endings and JSON validity
        run: |
          python - <<'EOF'
          import json, pathlib
          bad = []
          manifest = json.loads(pathlib.Path("manifest.json").read_text())
          json.loads(pathlib.Path("package.json").read_text())
          if not pathlib.Path("plugin/cordis.patch.yml").exists():
              bad.append("missing plugin/cordis.patch.yml")
          if "targets" in manifest:
              bad.append("manifest.json still uses the legacy hash 'targets' format - re-run tools/build-recipes.py")
          if not isinstance(manifest.get("recipes"), list) or not manifest["recipes"]:
              bad.append("manifest.json has no recipes")
          for r in manifest.get("recipes", []):
              f = r.get("file"); steps = r.get("steps"); markers = r.get("markers") or []
              if not f or not isinstance(steps, list) or not steps:
                  bad.append(f"recipe missing file/steps: {f}"); continue
              p = pathlib.Path("patches") / f
              if not p.exists():
                  bad.append(f"missing patch {f}"); continue
              data = p.read_bytes()
              if b"\r\n" in data:
                  bad.append(f"CRLF in {f} (gitattributes should keep patches as LF)")
              text = data.decode("utf-8")
              for m in markers:
                  if m not in text:
                      bad.append(f"marker {m!r} missing in patch {f}")
              for s in steps:
                  t = s.get("type")
                  if t == "insert":
                      if not s.get("before") or s["before"] not in text:
                          bad.append(f"insert anchor not in patch {f}: {(s.get('before') or '')[:60]!r}")
                      if not s.get("lines") or s["lines"] not in text:
                          bad.append(f"insert lines not in patch {f}")
                  elif t == "replace":
                      if not s.get("to") or s["to"] not in text:
                          bad.append(f"replace 'to' not in patch {f}: {(s.get('to') or '')[:60]!r}")
                  else:
                      bad.append(f"unknown step type in {f}: {t}")
          if bad:
              print("\n".join(bad)); raise SystemExit(1)
          print(f"OK: {len(manifest['recipes'])} recipes consistent with shipped patches (LF, markers, step texts)")
          EOF