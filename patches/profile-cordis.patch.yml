# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# net-access preset: replaces the dsh-base `permission` row config entirely
# (patches replace the row's whole config, so every preset is restated here).
# net-access confines file writes like workspace-write while restoring
# group-dependent APIs (WMI/CIM, reads); Windows outbound SSPI (Schannel
# HTTPS via curl/Invoke-WebRequest) still cannot work under a restricted
# token — use a non-SSPI TLS client (python/openssl) or full access.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      net-access:
        sandbox: net-access
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
